<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미니게임 - 원 클릭</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    h1 {
      margin: 25px 0 10px;
    }

    .info {
      display: flex;
      justify-content: center;
      gap: 40px;
      font-size: 20px;
      margin: 15px;
    }

    #game {
      position: relative;
      width: 800px;
      max-width: 90vw;
      height: 500px;
      margin: 20px auto;
      background: #1f2937;
      border: 3px solid #374151;
      border-radius: 15px;
      overflow: hidden;
    }

    #target {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #ef4444;
      cursor: pointer;
      display: none;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.7);
    }

    button {
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }

    #message {
      font-size: 22px;
      margin: 15px;
    }
  </style>
</head>

<body>

  <h1>🎯 원 클릭 미니게임</h1>

  <div class="info">
    <div>점수: <span id="score">0</span></div>
    <div>남은 시간: <span id="time">30</span>초</div>
  </div>

  <button id="startBtn">게임 시작</button>

  <div id="message">시작 버튼을 눌러주세요!</div>

  <div id="game">
    <div id="target"></div>
  </div>

  <script>
    const game = document.getElementById("game");
    const target = document.getElementById("target");
    const scoreText = document.getElementById("score");
    const timeText = document.getElementById("time");
    const startBtn = document.getElementById("startBtn");
    const message = document.getElementById("message");

    let score = 0;
    let time = 30;
    let timer = null;
    let playing = false;

    // 랜덤 위치에 원 배치
    function moveTarget() {
      const maxX = game.clientWidth - target.offsetWidth;
      const maxY = game.clientHeight - target.offsetHeight;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      target.style.left = x + "px";
      target.style.top = y + "px";
    }

    // 게임 시작
    function startGame() {
      score = 0;
      time = 30;
      playing = true;

      scoreText.textContent = score;
      timeText.textContent = time;

      target.style.display = "block";
      startBtn.disabled = true;
      message.textContent = "빠르게 원을 클릭하세요!";

      moveTarget();

      timer = setInterval(() => {
        time--;
        timeText.textContent = time;

        if (time <= 0) {
          endGame();
        }
      }, 1000);
    }

    // 원 클릭
    target.addEventListener("click", () => {
      if (!playing) return;

      score++;
      scoreText.textContent = score;

      moveTarget();
    });

    // 게임 종료
    function endGame() {
      clearInterval(timer);
      playing = false;

      target.style.display = "none";
      startBtn.disabled = false;

      message.textContent = `게임 종료! 최종 점수는 ${score}점입니다 🎉`;
    }

    startBtn.addEventListener("click", startGame);
  </script>

</body>
</html>
